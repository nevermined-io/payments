name: Dependabot auto-merge

# Use pull_request (NOT pull_request_target).
# Since October 2021, GitHub respects the permissions key for Dependabot PRs,
# making pull_request_target unnecessary and less secure.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Generate release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Approve and enable auto-merge for patch and minor updates.
      # Major version bumps are left as-is for manual review.
      #
      # Auto-merge completes once three things hold: every required check
      # passes, the review requirement is satisfied, and the branch is up to
      # date (`strict: true` on main — which is why
      # dependabot-update-branches.yml exists).
      #
      # The second only began holding on 2026-09-14. Until then main carried
      # `require_code_owner_reviews: true` against a CODEOWNERS of
      # `* @nevermined-io/nevermined-admin @nevermined-io/nevermined-doers`, and
      # a GitHub App can never be a code owner — CODEOWNERS entries are users,
      # teams or emails — so this approval counted for nothing and every bump
      # sat at `reviewDecision: REVIEW_REQUIRED`. #409 was the proof: its three
      # required contexts (`E2E`, `Lint & Build`, `Unit & Integration`) green
      # and two APPROVED reviews from the release bot, BLOCKED from 2026-07-20
      # until the setting changed, at which point the same PR read APPROVED with
      # nothing about it touched.
      #
      # `require_code_owner_reviews` is now false — what nvm-monorepo's ruleset
      # already did — and `required_approving_review_count` stays 1, so this
      # step's approval is what satisfies it. If bumps ever stall at
      # REVIEW_REQUIRED again, read that setting first.
      # The policy is read from the BASE branch, never from the PR's own head:
      # a Dependabot branch is untrusted content, and reading a manifest it
      # carries to decide whether to approve it would let the PR answer its own
      # question. `base.sha` pins this to what is already on main, and no
      # credentials are persisted since nothing here pushes.
      - name: Checkout the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Patch and minor are approved as before. A major is approved only when
      # all three of these hold:
      #
      # 1. It updates the ROOT manifest. Branch protection requires exactly
      #    three contexts — `E2E`, `Lint & Build`, `Unit & Integration` — and
      #    all three run against the root package. `CLI Sync Check` and
      #    `OpenClaw Plugin Check` are NOT required, so a major in /cli or
      #    /openclaw could auto-merge on root-only green, with the suites that
      #    would actually exercise it never gating anything. Until those two are
      #    required contexts, a major outside the root gets a human.
      # 2. Every package it bumps is declared *only* under `devDependencies` —
      #    `dependencies`, `peerDependencies` and `optionalDependencies` all
      #    count as runtime, because a peer or optional major changes what a
      #    consumer resolves just as surely as a direct one does.
      # 3. `update-type` is explicitly `version-update:semver-major`. Anything
      #    else — an empty string, a value this action has not shipped yet — is
      #    not a category to approve on: unknown means a human.
      #
      # The names are read off the base branch's manifests rather than
      # `dependency-type`, because fetch-metadata does not document what that
      # output reports when a PR bumps several packages at once, and a grouped
      # PR is exactly where a runtime package could ride along with dev ones.
      - name: Decide whether this PR may be approved
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
        run: .github/scripts/dependabot-policy.sh

      - name: Report the decision
        env:
          APPROVE: ${{ steps.policy.outputs.approve }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: echo "approve=$APPROVE ($REASON)"

      - name: Approve PR
        if: steps.policy.outputs.approve == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.policy.outputs.approve == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
