name: Dependabot auto-merge

# Use pull_request (NOT pull_request_target).
# Since October 2021, GitHub respects the permissions key for Dependabot PRs,
# making pull_request_target unnecessary and less secure.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Generate release bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Approve and enable auto-merge for patch and minor updates.
      # Major version bumps are left as-is for manual review.
      #
      # Auto-merge completes once three things hold: every required check
      # passes, the review requirement is satisfied, and the branch is up to
      # date (`strict: true` on main — which is why
      # dependabot-update-branches.yml exists).
      #
      # The second only began holding on 2026-09-14. Until then main carried
      # `require_code_owner_reviews: true` against a CODEOWNERS of
      # `* @nevermined-io/nevermined-admin @nevermined-io/nevermined-doers`, and
      # a GitHub App can never be a code owner — CODEOWNERS entries are users,
      # teams or emails — so this approval counted for nothing and every bump
      # sat at `reviewDecision: REVIEW_REQUIRED`. #409 was the proof: its three
      # required contexts (`E2E`, `Lint & Build`, `Unit & Integration`) green
      # and two APPROVED reviews from the release bot, BLOCKED from 2026-07-20
      # until the setting changed, at which point the same PR read APPROVED with
      # nothing about it touched.
      #
      # `require_code_owner_reviews` is now false — what nvm-monorepo's ruleset
      # already did — and `required_approving_review_count` stays 1, so this
      # step's approval is what satisfies it. If bumps ever stall at
      # REVIEW_REQUIRED again, read that setting first.
      - name: Approve PR
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Enable auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
