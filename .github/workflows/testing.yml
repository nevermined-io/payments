name: Payments Tests

on: [push]

concurrency:
  group: payments-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # The Dependabot approval policy only executes on Dependabot PRs, so no
      # ordinary run reaches it: without this, deleting one of its guards
      # leaves every check green and silently restores automatic approval.
      - name: Test the Dependabot approval policy
        run: .github/scripts/dependabot-policy.test.sh

      # `pnpm build` compiles src only — tsconfig.json excludes `tests`, and
      # ts-jest transpiles without checking (the root `isolatedModules: true`),
      # so nothing else in CI ever typechecks a test file.
      #
      # Last in the job on purpose: it is the newest and noisiest gate, and
      # running it ahead of Lint would fail-fast past lint errors that used to
      # surface in the same run.
      - name: Typecheck tests
        run: pnpm typecheck:tests

  cli_sync_check:
    name: CLI Sync Check
    runs-on: ubuntu-latest
    needs: lint_build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Install CLI dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Link local SDK into CLI
        run: rm -rf cli/node_modules/@nevermined-io/payments && ln -s "$PWD" cli/node_modules/@nevermined-io/payments

      - name: Build CLI
        working-directory: cli
        run: pnpm build

      - name: Run CLI sync check
        working-directory: cli
        run: pnpm sync-check

      - name: Run CLI tests
        working-directory: cli
        run: pnpm test

  openclaw_check:
    name: OpenClaw Plugin Check
    runs-on: ubuntu-latest
    needs: lint_build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Install OpenClaw Plugin dependencies
        working-directory: openclaw
        run: pnpm install --frozen-lockfile

      - name: Link local SDK into OpenClaw Plugin
        run: rm -rf openclaw/node_modules/@nevermined-io/payments && ln -s "$PWD" openclaw/node_modules/@nevermined-io/payments

      - name: Build OpenClaw Plugin
        working-directory: openclaw
        run: pnpm build

      - name: Run OpenClaw Plugin tests
        working-directory: openclaw
        run: pnpm test

  unit_integration:
    name: Unit & Integration
    runs-on: ubuntu-latest
    needs: lint_build
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        env:
          TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
          TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
          TEST_ENVIRONMENT: ${{ secrets.TEST_ENVIRONMENT }}
        run: pnpm test:integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: unit_integration
    # One E2E at a time across every ref. The staging AA bundler answers 429
    # when 5-6 runs overlap (a Dependabot update wave), and the API turns that
    # into a non-retryable BCK.PROTOCOL.0059 (nvm-monorepo#5373, #5391).
    # `queue: max` keeps up to 100 jobs waiting in FIFO order; the default
    # (`single`) would cancel every pending E2E but the newest, losing other
    # PRs' required check. Superseded pushes to the same ref are still
    # cancelled by the workflow-level group above.
    concurrency:
      group: payments-e2e-staging-sandbox
      queue: max
    continue-on-error: true
    timeout-minutes: 40
    env:
      TEST_SUBSCRIBER_API_KEY: ${{ secrets.TEST_SUBSCRIBER_API_KEY }}
      TEST_BUILDER_API_KEY: ${{ secrets.TEST_BUILDER_API_KEY }}
      TEST_ENVIRONMENT: staging_sandbox
      NVM_FRONTEND_URL: https://api-base-sepolia.staging.nevermined.app/
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm test:e2e --detectOpenHandles
